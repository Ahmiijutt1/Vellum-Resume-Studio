:root{--ink:#16202e;--mut:#5b6678;--bg:#eef1f5;--srf:#fff;--ln:#d5dbe4;--ac:#0b6e6e;--acd:#084f4f;--warn:#9a5b00;--bad:#a4262c;--ok:#1d6b3a}
*{box-sizing:border-box}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}html,body{height:100%;margin:0}
body{font:14px/1.45 'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{border:1px solid var(--ln);background:var(--srf);border-radius:6px;padding:5px 10px}.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:var(--acd)}
.btn.dng{color:var(--bad)}.btn.sm{padding:4px 9px;font-size:12px}
body>header{display:flex;align-items:center;gap:20px;padding:0 18px;height:52px;background:var(--srf);border-bottom:1px solid var(--ln);flex:none}
body>header b{font-size:19px;letter-spacing:-.02em}nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{border:0;background:none;padding:15px 10px;color:var(--mut);border-bottom:2px solid transparent}
nav button[aria-current=page]{color:var(--ink);font-weight:700;border-color:var(--ink)}
#banner{background:#fff4e0;color:var(--warn);padding:8px 18px;border-bottom:1px solid #f0d9ad;display:none;flex:none}
#banner.on{display:block}#remind{background:#eaf3f3;color:var(--ink);padding:8px 18px;border-bottom:1px solid #cfe3e3;flex:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#remind[hidden]{display:none}#remind.wn{background:#fff4e0;border-color:#f0d9ad}#banner.err{background:#fde8ea;color:var(--bad)}
main{flex:1;display:flex;min-height:0}
aside{width:470px;flex:none;overflow:auto;padding:14px;border-right:1px solid var(--ln)}
.prev{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.tb{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;background:var(--srf);border-bottom:1px solid var(--ln);font-size:12.5px}
.stage{flex:1;overflow:auto;padding:22px;display:flex;justify-content:flex-start}.stage>*{margin:0 auto}
.lipanel{flex:1;overflow:auto;padding:18px;display:none;min-height:0}.lipanel textarea{display:block;width:100%;margin-top:6px;padding:8px;border:1px solid var(--ln);border-radius:6px;background:#fff;color:var(--ink);font-size:13.5px;resize:vertical}
main.li aside{display:none}main.li .lipanel{display:block}main.li .prev{position:absolute;left:-10000px;top:0;width:900px;visibility:hidden;pointer-events:none}main.wide aside{display:none}
.card{background:var(--srf);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .full{grid-column:1/-1}
label.f{display:block;font-size:12px;color:var(--mut)}label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:2px;padding:6px 8px;border:1px solid var(--ln);border-radius:6px;background:#fff;color:var(--ink);font-size:13.5px}
label.f textarea{resize:vertical}
details.sec{background:var(--srf);border:1px solid var(--ln);border-radius:8px;margin-bottom:8px}
summary{cursor:pointer}details.sec>summary{padding:10px 12px;font-weight:700}details.sec>div{padding:0 12px 12px}.hint{color:var(--warn);font-size:11.5px}.pg{box-shadow:0 10px 34px -12px rgba(22,32,46,.35),0 0 0 1px rgba(22,32,46,.08)}.pglab{font-size:12px;color:var(--mut);padding:10px 0 6px}.pglab:first-child{padding-top:0}#margc{display:inline-flex;gap:6px;align-items:center}#margc[hidden]{display:none}#margc input{width:56px;padding:3px 5px;border:1px solid var(--ln);border-radius:5px}.lig{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;max-width:1200px;margin:0 auto}.lig>div>.card{margin-bottom:12px}.seg{display:flex;flex-wrap:wrap;gap:6px}.btn.pri[aria-pressed=true]{outline:0}.pre{white-space:pre-wrap;font-size:13.5px;line-height:1.5;background:#f8fafc;border:1px solid var(--ln);border-radius:6px;padding:10px;margin:8px 0 0}.fold{border-top:2px dashed #0a66c2;margin:8px 0;color:#0a66c2;font-size:11.5px;padding-top:4px}.opt{text-align:left;display:block;width:100%;margin-bottom:6px}.chip{display:inline-block;border:1px solid var(--ln);border-radius:999px;padding:1px 9px;margin:0 4px 4px 0;font-size:12.5px;background:#f8fafc}@media(max-width:900px){.lig{grid-template-columns:1fr}}.chg{border-left:3px solid var(--ln);padding:4px 0 4px 10px;margin:6px 0}.chg.added{border-color:var(--ok)}.chg.removed{border-color:var(--bad)}.chg.changed{border-color:var(--warn)}.chg b.k{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}.chg ins{background:#dff3e4;text-decoration:underline}.chg del{background:#fbe0e3;text-decoration:line-through}.th{flex:none;overflow:hidden;border:1px solid var(--ln);border-radius:3px;position:relative;background:#fff}.th *{pointer-events:none}.tag.ok{border-color:var(--ok);color:var(--ok)}.btn:disabled{opacity:.45;cursor:default}
h2{font-size:15px;margin:0 0 8px}h3{font-size:13.5px;margin:0 0 6px}.mut{color:var(--mut);font-size:12.5px}
.tpl{display:flex;gap:10px;align-items:flex-start}.sw{width:46px;height:60px;border:1px solid var(--ln);border-radius:3px;flex:none;position:relative;overflow:hidden}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:10px;padding:0 7px;color:var(--mut)}
.ok{color:var(--ok)}.wn{color:var(--warn)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;display:none;z-index:9;max-width:90vw}
body>footer{flex:none;padding:5px 18px;font-size:12px;color:var(--mut);background:var(--srf);border-top:1px solid var(--ln);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mob{display:none}
@media(max-width:900px){main{flex-direction:column}aside{width:100%;border:0;max-height:none;flex:1 1 0;min-height:0}.mob{display:inline-block;margin-left:auto;order:1}body>header{flex-wrap:wrap;height:auto;padding:8px 12px;gap:4px 10px}body>header b{order:0}body>header #print{order:2}nav{order:3;flex:1 0 100%}nav button{padding:10px 12px}.btn.sm{padding:7px 11px}
main.mp aside{display:none}main:not(.mp) .prev{position:absolute;left:-10000px;top:0;width:900px;visibility:hidden;pointer-events:none}.stage{padding:10px}}
@media print{.pg{box-shadow:none!important;break-after:page;page-break-after:always;margin:0!important}.pg:last-child{break-after:auto;page-break-after:auto}.pglab{display:none!important}body{display:block;background:#fff;height:auto}.np,body>header,body>footer,#banner,aside,.tb,.lipanel,#toast{display:none!important}
main,.prev,.stage{display:block!important;position:static!important;visibility:visible!important;width:auto!important;padding:0!important;overflow:visible!important}.wrap{transform:none!important;width:auto!important;height:auto!important;box-shadow:none!important}
#sheet{transform:none!important;box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
